name: talkila

services:
  nginx:
    build:
      context: ./Docker/Nginx
      dockerfile: Dockerfile
    container_name: talkila-nginx
    ports:
      - "127.0.0.8:80:80"
      - "127.0.0.8:443:443"
    volumes:
      - ./talkila.backend:/var/www/html:cached
      - ./Docker/Nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./Docker/Nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - laravel
      - phpmyadmin
    networks:
      - talkila-network
    restart: unless-stopped

  laravel:
    build:
      context: .
      dockerfile: Docker/Laravel/Dockerfile
    # CI builds this image once (cached) and sets LARAVEL_IMAGE, so compose reuses it instead of rebuilding.
    image: ${LARAVEL_IMAGE:-talkila-laravel:local}
    container_name: talkila-laravel
    volumes:
      - ./talkila.backend:/var/www/html:cached
      - ./Docker/Laravel/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./Docker/Laravel/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-talkila}
      - DB_USERNAME=${DB_USERNAME:-talkila}
      - DB_PASSWORD=${DB_PASSWORD:-talkila_secret}
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - talkila-network
    restart: unless-stopped

  # Same engine and major version as production (Hostinger MariaDB 11.8).
  mariadb:
    image: mariadb:11.8
    container_name: talkila-mariadb
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-talkila}
      MARIADB_USER: ${DB_USERNAME:-talkila}
      MARIADB_PASSWORD: ${DB_PASSWORD:-talkila_secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-talkila_root}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./Docker/MariaDB:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.8:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - talkila-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: talkila-phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_ABSOLUTE_URI: https://talkila.local/phpmyadmin/
      UPLOAD_LIMIT: 256M
    depends_on:
      - mariadb
    networks:
      - talkila-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: talkila-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - talkila-network
    restart: unless-stopped

volumes:
  mariadb-data:
  redis-data:

networks:
  talkila-network:
    driver: bridge
